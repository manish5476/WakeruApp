name: Build Android APK
on:
  push:
    branches: [master, main]
  workflow_dispatch: # Allows clicking "Run workflow" manually from GitHub anytime!
jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: pnpm install

      - name: Fix Kotlin plugin conflicts across all packages
        run: |
          echo "Patching all node_modules to remove redundant kotlin plugin applications..."
          find . -path "*/node_modules/*" -name "build.gradle" -type f -exec sed -i -e "s/apply plugin: 'kotlin-android'/\/\/ apply plugin: 'kotlin-android'/g" -e "s/apply plugin: 'org.jetbrains.kotlin.android'/\/\/ apply plugin: 'org.jetbrains.kotlin.android'/g" -e 's/apply plugin: "kotlin-android"/\/\/ apply plugin: "kotlin-android"/g' -e 's/apply plugin: "org.jetbrains.kotlin.android"/\/\/ apply plugin: "org.jetbrains.kotlin.android"/g' {} +

          echo "Patching datetimepicker specifically for kotlinOptions..."
          PICKER_BUILD="apps/mobile/node_modules/@react-native-community/datetimepicker/android/build.gradle"
          if [ -f "$PICKER_BUILD" ]; then
            sed -i '/kotlinOptions/,/}/{ s/^/\/\//; }' "$PICKER_BUILD"
          fi
          echo "✅ Kotlin patches applied globally"
      - name: Inject Production Environment Variables
        run: |
          echo "API_URL=https://wakeru.onrender.com/api/v1" > apps/mobile/.env
          echo "EXPO_PUBLIC_API_URL=https://wakeru.onrender.com/api/v1" >> apps/mobile/.env

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripSplit-Release-APK
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14 # Keeps download active for 2 weeks
