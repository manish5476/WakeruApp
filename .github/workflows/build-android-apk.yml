name: Build Android APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h

          echo "Removing large unnecessary files..."
          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get autoremove -y
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/google
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/swift
          sudo rm -rf /opt/cni-plugins
          sudo rm -rf /opt/conda
          sudo rm -rf /opt/runner-cache
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/share/swift

          echo "Clearing pip cache..."
          sudo rm -rf ~/.cache/pip

          echo "Clearing npm cache..."
          sudo npm cache clean --force || true

          echo "Clearing docker images..."
          sudo docker image prune -a -f || true

          echo "Disk space after cleanup:"
          df -h

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production
        run: |
          touch .env.production
          # If you have secrets, populate them here:
          # echo "API_URL=${{ secrets.API_URL }}" >> .env.production

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          echo "Gradle cache cleared"

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          ./gradlew clean assembleRelease \
            --no-daemon \
            --parallel=false \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:+UseG1GC" \
            -Dorg.gradle.daemon=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripSplit-Release-APK
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            apps/mobile/android/build/reports/
            apps/mobile/android/app/build/reports/
          retention-days: 7